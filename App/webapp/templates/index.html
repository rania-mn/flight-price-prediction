<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 


<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center mb-4">Flight Price Prediction</h2>

    <form method="POST" enctype="multipart/form-data">
        
        <!-- JSON Upload -->
        <div class="mb-3">
            <label for="json_file" class="form-label"><strong>Upload JSON File</strong></label>
            <input class="form-control" type="file" id="json_file" name="json_file">
            <small class="text-muted">Si un fichier JSON est uploadé, les champs manuels seront ignorés.</small>
        </div>

        <hr>

        <!-- NUMERICAL FEATURES -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <h5>Duration (Hours)</h5>
                <input type="number" step="0.1" name="duration" class="form-control" placeholder="Ex: 2">
            </div>

            <div class="col-md-6 mb-3">
                <h5>Days Left</h5>
                <input type="number" name="days_left" class="form-control" placeholder="Ex: 10">
            </div>
        </div>

        <hr>

        <div class="row">
         <div class="col-md-6">
        <!-- AIRLINES -->
        <h5>Airline</h5>
        <select name="airline" class="form-control mb-3" required>
            {% for a in airlines %}
                <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>

        <!-- DEPARTURE TIME -->
        <h5>Departure Time</h5>
        <select name="departure_time" class="form-control mb-3" required>
            {% for d in departure_times %}
                <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
        </select>

        <!-- DESTINATION CITY -->
        <h5>Destination City</h5>
        <select name="destination_city" class="form-control mb-3" required>
            {% for d in destination_cities %}
                <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
        </select>

        <!-- CLASS -->
        <h5>Class</h5>
        <select name="class" class="form-control mb-3" required>
            {% for c in classes %}
                <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-6">
        <!-- SOURCE CITY -->
        <h5>Source City</h5>
        <select name="source_city" class="form-control mb-3" required>
            {% for s in source_cities %}
                <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>

        <!-- STOPS -->
        <h5>Stops</h5>
        <select name="stops" class="form-control mb-3" required>
            {% for s in stops_list %}
                <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>

        <!-- ARRIVAL TIME -->
        <h5>Arrival Time</h5>
        <select name="arrival_time" class="form-control mb-3" required>
            {% for a in arrival_times %}
                <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>
    </div>
</div>

    <div class="text-end">
        <button type="submit" class="btn btn-primary px-3">Predict Price</button>
    </div>
    </form>

    {% if prediction %}
    <div class="alert alert-success mt-4 d-inline-block p-3">
        <h4>Predicted Price : {{ "%.2f"|format(prediction) }} INR</h4>
    </div>
    {% endif %}

</div>
</body>
</html>
